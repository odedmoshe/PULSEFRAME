<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PULSEFRAME Lab</title>
    <style>
      body { margin: 0; padding: 24px; background: #0d1015; color: #e6e9ee; font: 14px/1.5 Heebo, system-ui, sans-serif; }
      h1 { margin: 0 0 8px; } h2 { margin: 32px 0 12px; border-block-end: 1px solid #2a313c; padding-block-end: 6px; }
      p { max-inline-size: 70ch; color: #aab2bf; }
      .grid { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
      figure { margin: 0; background: #151a21; border: 1px solid #2a313c; border-radius: 8px; padding: 8px; }
      figure canvas { display: block; max-inline-size: 100%; background: #000; }
      figure.strip canvas { inline-size: 190px; block-size: auto; }
      figcaption { font-size: 12px; max-inline-size: 640px; direction: ltr; text-align: start; color: #aab2bf; word-break: break-word; }
      figcaption b { color: #e6e9ee; }
      .tile-error { color: #ff8a8a; font-family: monospace; padding: 8px; }
      .row { display: flex; gap: 6px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/lab.ts"></script>
  </body>
</html>
